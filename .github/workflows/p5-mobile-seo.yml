name: P5 mobile CTA and SEO verification
on:
  workflow_call:
  push:
    branches: [fix/p5-mobile-seo-20260916]
permissions:
  contents: write
concurrency:
  group: p5-mobile-seo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        if: github.repository != 'webiq1206/boise-remodeling-co'
        with:
          repository: webiq1206/boise-remodeling-co
          ref: 21e293f534d8ddfd11094d966b369dfc2dab5a8d
          path: .p5-seo-source
          persist-credentials: false
          sparse-checkout: |
            hooks/use-mobile-action-visibility.ts
            lib/brand-page-metadata.ts
            scripts/integrate-p5-mobile-seo.mjs
            scripts/integrate-p5-mobile-seo-compatible.mjs
            scripts/verify-p5-mobile-seo.mjs
            tests/p5-brand-page-metadata.test.ts
          sparse-checkout-cone-mode: false
      - name: Copy reviewed shared source
        if: github.repository != 'webiq1206/boise-remodeling-co'
        run: |
          for file in hooks/use-mobile-action-visibility.ts lib/brand-page-metadata.ts scripts/integrate-p5-mobile-seo.mjs scripts/integrate-p5-mobile-seo-compatible.mjs scripts/verify-p5-mobile-seo.mjs tests/p5-brand-page-metadata.test.ts; do
            mkdir -p "$(dirname "$file")"
            cp ".p5-seo-source/$file" "$file"
          done
          rm -rf .p5-seo-source
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Integrate brand-aware changes
        run: node scripts/integrate-p5-mobile-seo-compatible.mjs
      - name: Check new code types and metadata regression tests
        run: |
          npx tsc --noEmit --allowImportingTsExtensions --skipLibCheck --target ES2022 --module esnext --moduleResolution bundler --jsx react-jsx --esModuleInterop hooks/use-mobile-action-visibility.ts lib/brand-page-metadata.ts
          node --import tsx --test tests/p5-brand-page-metadata.test.ts
      - name: Existing estimator tests
        run: node --import tsx --test --test-concurrency=1 tests/p5-*.test.ts > p5-mobile-seo-verification/estimator-tests.log
      - name: Production build and repository gates
        run: |
          set -o pipefail
          npm run build 2>&1 | tee p5-mobile-seo-verification/build.log
      - run: npx playwright install --with-deps chromium
      - name: Verify rendered metadata and mobile actions
        run: |
          npx next start -p 5000 > p5-mobile-seo-verification/server.log 2>&1 &
          node -e 'let n=0;const t=setInterval(async()=>{try{const r=await fetch("http://127.0.0.1:5000/");if(r.ok){clearInterval(t)}}catch{}if(++n>60){clearInterval(t);process.exit(1)}},1000)'
          node scripts/verify-p5-mobile-seo.mjs
      - name: Verify handoff UI using an isolated saved draft
        run: |
          node --import tsx --input-type=module <<'JS'
          import {chromium} from '@playwright/test';import assert from 'node:assert/strict';import {writeFile} from 'node:fs/promises';import {ESTIMATOR_BRAND as brand} from './lib/p5/brand.ts';
          const service=brand.id==='construction'?'kitchen':brand.id==='remodeling'?'new-construction':brand.id==='handyman'?'cabinet-install':brand.id==='cabinet'?'handyman':null;
          if(service){
            const dest=service==='kitchen'?'https://boiseremodeling.co':service==='new-construction'?'https://boiseconstruction.co':service==='handyman'?'https://boisehandyman.co':'https://boisecabinet.co';
            const browser=await chromium.launch();try{const ctx=await browser.newContext({viewport:{width:390,height:844}});
              await ctx.addInitScript(({service})=>localStorage.setItem('p5-project-draft-v2',JSON.stringify({id:'11111111-1111-4111-8111-111111111111',key:'a'.repeat(64),revision:0,text:'Isolated browser handoff fixture',answers:{service,taskList:'Complete project'},extraction:null,contact:{name:'',email:'',phone:''},step:1,updatedAt:Date.now(),wizard:{skipped:[],resolutions:{}},uploads:[]})),{service});
              const page=await ctx.newPage();await page.goto('http://127.0.0.1:5000/estimate/p5-preview');
              await page.locator('[aria-label="Project question"]').waitFor();
              const links=page.locator(`[data-p5-estimator] a[href="${dest}"]`);assert.ok(await links.count()>0,'Missing actual handoff link');
              assert.equal(await page.getByRole('button',{name:'Send answer',exact:true}).count(),0,'Handoff must not ask for another answer');
              await page.screenshot({path:'p5-mobile-seo-verification/handoff-390.png'});
              await writeFile('p5-mobile-seo-verification/handoff.json',JSON.stringify({brand:brand.id,service,destination:dest,linkPresent:true,answerComposerAbsent:true,scope:'Isolated UI fixture only, not a live provider test'}));
            }finally{await browser.close();}
          }
          JS
      - name: Commit only verified source and brand assets
        run: |
          git diff --check
          git config user.name 'P5 Verified Updates'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node --input-type=module <<'JS'
          import fs from 'node:fs';import {execFileSync} from 'node:child_process';
          const v=JSON.parse(fs.readFileSync('p5-mobile-seo-verification/implementation.json','utf8'));
          const paths=[...v.changed,...v.wrapped,...v.generatedImages,'hooks/use-mobile-action-visibility.ts','lib/brand-page-metadata.ts','scripts/integrate-p5-mobile-seo.mjs','scripts/integrate-p5-mobile-seo-compatible.mjs','scripts/verify-p5-mobile-seo.mjs','tests/p5-brand-page-metadata.test.ts'];
          execFileSync('git',['add','-f','--',...new Set(paths)]);
          JS
          if ! git diff --cached --quiet; then
            git commit -m 'Apply verified mobile actions, brand metadata and estimator handoff controls'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          git rev-parse HEAD > p5-mobile-seo-verification/tested-commit.txt
      - name: Retain preview assets
        if: always()
        run: |
          mkdir -p p5-mobile-seo-verification
          cp public/brand/page-preview.png public/brand/search-icon-96.png p5-mobile-seo-verification/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p5-mobile-seo-verification
          path: p5-mobile-seo-verification
          retention-days: 14
