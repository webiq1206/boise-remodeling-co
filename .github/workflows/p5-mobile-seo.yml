name: P5 interface and metadata verification
on:
  push:
    branches: [fix/p5-interface-completion-20260917, claude/diag-webkit-request]
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'hooks/**'
      - 'lib/brand-page-metadata.ts'
      - 'lib/page-metadata.ts'
      - 'lib/seo.ts'
      - 'lib/seo-keywords.ts'
      - 'lib/seo-routes.ts'
      - 'lib/siteUrls.ts'
      - 'lib/schema.ts'
      - 'lib/schemaTime.ts'
      - 'lib/landing-schema.ts'
      - 'shared/ctaCopy.ts'
      - 'shared/seoContent.ts'
      - 'shared/siteContent.ts'
      - 'shared/contentData.ts'
      - 'shared/contentHubs.ts'
      - 'shared/contentImageAlt.ts'
      - 'shared/guideContent.ts'
      - 'shared/guideResources.ts'
      - 'shared/homepageFaqs.ts'
      - 'shared/blogContent.ts'
      - 'shared/blogImageRegistry.ts'
      - 'shared/blogOgImages.ts'
      - 'shared/gbpProfile.ts'
      - 'shared/resourcePdfContent.ts'
      - 'shared/content/**'
      - 'data/internal-links.json'
      - 'public/llms.txt'
      - 'public/llms-full.txt'
      - 'public/brand/**'
      - 'lib/p5/adaptive.ts'
      - 'tests/p5-brand*.test.ts'
      - 'scripts/verify-p5-mobile-seo.mjs'
      - '.github/workflows/p5-mobile-seo.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p5-interface-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Optional intake fragment navigation regressions
        run: node scripts/test-optional-intake-navigation.mjs
      - name: Production app responsive and public metadata audit
        run: |
          mkdir -p p5-mobile-seo-verification
          git rev-parse HEAD > p5-mobile-seo-verification/tested-commit.txt
          npm run start -- --port 5000 > p5-mobile-seo-verification/server.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5000/robots.txt > /dev/null; then break; fi
            sleep 1
          done
          node scripts/diag-mobile-load.mjs
          node scripts/verify-p5-mobile-seo.mjs
      - name: Offline evidence guard regressions
        run: node --test tests/ci-evidence.test.mjs
      - name: Package complete evidence within storage limit
        id: evidence
        if: always()
        run: node scripts/prepare-ci-evidence.mjs mobile
      - uses: actions/upload-artifact@v4
        if: always() && steps.evidence.outputs.archive_ready == 'true'
        with:
          name: p5-interface-verification
          path: ci-evidence-artifacts/mobile.tar.gz
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
