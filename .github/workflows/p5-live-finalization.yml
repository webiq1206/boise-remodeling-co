name: P5 live finalization audit
on:
  push:
    branches: [qa/p5-live-finalization-20260916]
permissions:
  contents: read
concurrency:
  group: p5-live-finalization
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: construction
            repo: Boise-Construction-Co
          - site: remodeling
            repo: boise-remodeling-co
          - site: handyman
            repo: Boise-Handyman-Co
          - site: cabinet
            repo: Boise-Cabinet-Co
          - site: p5
            repo: p5-home-co
    env:
      P5_QA_SITE: ${{ matrix.site }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: webiq1206/${{ matrix.repo }}
          ref: main
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 053310544fe0b1753f341d60de37b6066897a800
          path: .qa-source
          persist-credentials: false
          sparse-checkout: |
            scripts/p5-live-finalization.mjs
            scripts/p5-live-followthrough.mjs
          sparse-checkout-cone-mode: false
      - name: Copy controlled live QA scripts
        run: |
          cp .qa-source/scripts/p5-live-finalization.mjs scripts/p5-live-finalization.mjs
          cp .qa-source/scripts/p5-live-followthrough.mjs scripts/p5-live-followthrough.mjs
          mkdir -p p5-live-finalization/${P5_QA_SITE}
          git rev-parse HEAD > p5-live-finalization/${P5_QA_SITE}/repository-commit.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Actual uploaded PDF through terminal pricing and download
        run: node scripts/p5-live-followthrough.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p5-live-${{ matrix.site }}
          path: |
            p5-live-finalization/${{ matrix.site }}/*.json
            p5-live-finalization/${{ matrix.site }}/*.png
            p5-live-finalization/${{ matrix.site }}/*.pdf
            p5-live-finalization/${{ matrix.site }}/*.txt
          retention-days: 14
