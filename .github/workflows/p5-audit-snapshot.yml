name: P5 audit source snapshot
on:
  push:
    branches: [codex/p5-final-audit]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz -o source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot
          path: source.tar.gz
          retention-days: 3
