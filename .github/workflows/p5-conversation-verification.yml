name: P5 conversation and recovery regressions
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, labeled, reopened]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: p5-conversation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ANTHROPIC_API_KEY: ''
      OPENAI_API_KEY: ''
      DATABASE_URL: ''
      P5_DOCUMENT_SERVICE_MODE: ''
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Offline assistant with inherited host gateway settings
        env:
          AI_INTEGRATIONS_OPENAI_API_KEY: synthetic-gateway-key
          AI_INTEGRATIONS_OPENAI_BASE_URL: http://localhost:1106/v1
          OPENAI_BASE_URL: http://localhost:1107/v1
        run: npm run verify:assistant
      - name: Offline estimator and conversation checks
        run: node --import tsx --test --test-concurrency=1 tests/p5-*.test.ts
      - name: Isolated saved-file adapter checks
        run: node --import tsx scripts/test-p5-document-adapter.mts
      - name: Upload faults and hostile document replies
        run: |
          node --import tsx scripts/test-p5-upload-adversarial.mts
          node --import tsx scripts/test-p5-document-adversarial.mts
      - name: Pricing identity, recovery and captured delivery
        run: |
          node --import tsx scripts/test-p5-pricing-identity.mts
          node --import tsx scripts/test-p5-pricing-recovery.mts
          node --import tsx scripts/test-p5-pricing-work.mts
          node --import tsx scripts/test-p5-workflow.mts
      - name: Production build
        run: npm run build
      - name: Source integrity
        run: git diff --exit-code -- . ':(exclude)public/downloads/*.pdf'
