name: P5 document adapter verification
on:
  push:
    branches: [main, fix/shared-document-service-hardening-20260917]
    paths: ['lib/p5/**', 'scripts/*document*', 'scripts/grep-client-reviews.mjs', 'tests/client-review-guard.test.mjs', 'tests/p5-*.test.ts', '.github/workflows/p5-document-adapter.yml']
  pull_request:
    paths: ['lib/p5/**', 'scripts/*document*', 'scripts/grep-client-reviews.mjs', 'tests/client-review-guard.test.mjs', 'tests/p5-*.test.ts', '.github/workflows/p5-document-adapter.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p5-document-adapter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Record exact source under test
        run: |
          mkdir -p document-adapter-verification
          git rev-parse HEAD > document-adapter-verification/tested-commit.txt
      - name: Saved-file, source coverage, duplicate-upload and retry regression
        run: |
          set -o pipefail
          node --import tsx scripts/test-p5-document-adapter.mts 2>&1 | tee document-adapter-verification/adapter-integration.log
      - name: Existing estimator regressions
        run: |
          set -o pipefail
          node --import tsx --test --test-concurrency=1 tests/p5-*.test.ts 2>&1 | tee document-adapter-verification/estimator-tests.log
      - name: Saved pricing timeout recovery
        run: node --import tsx scripts/test-p5-pricing-recovery.mts
      - name: TypeScript verification
        run: npx tsc --noEmit
      - name: Production build with remote mode disabled
        run: |
          set -o pipefail
          node --test tests/client-review-guard.test.mjs
          npm run build 2>&1 | tee document-adapter-verification/build.log
      - name: Confirm maintained source remains unchanged
        run: |
          # Existing prebuild scripts regenerate these assets, including PDF timestamps.
          # Keep every maintained source file protected against test-time mutation.
          git diff --exit-code -- . ':(exclude)public/downloads/*.pdf'
      - name: Offline evidence guard regressions
        run: node --test tests/ci-evidence.test.mjs
      - name: Package complete evidence within storage limit
        id: evidence
        if: always()
        run: node scripts/prepare-ci-evidence.mjs document
      - uses: actions/upload-artifact@v4
        if: always() && steps.evidence.outputs.archive_ready == 'true'
        with:
          name: document-adapter-verification
          path: ci-evidence-artifacts/document.tar.gz
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
