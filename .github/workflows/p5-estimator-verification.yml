name: P5 estimator policy and workflow verification
on:
  workflow_dispatch:
  push:
    branches: [claude/diag-webkit-request,fix/estimator-flow-20260913,release/estimator-overhaul-20260912,wip/estimator-overhaul-20260912,fix/research-format,fix/pricing-batches,fix/pricing-latency,fix/readable-estimates,fix/complete-scope-pricing, codex/activate-cost-books-20260911, codex/finalize-estimators-20260911, codex/p5-intelligent-wizard-20260910, codex/p5-upload-receipt-fix-20260910, main, codex/p5-estimator-policy-20260910, codex/p5-merge-all-20260910, codex/p5-complete-main-20260910]
  pull_request:
    paths: ['app/services/**', 'components/seo/LandingPageTemplate.tsx', 'shared/serviceSceneImages.ts', 'public/images/service-scenes/**', 'components/P5Estimator.tsx', 'scripts/p5-estimator-browser.mjs', '.github/workflows/p5-estimator-verification.yml']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Production build and existing repository gates
        run: npm run build
      - name: Production browser rendering and interaction checks
        run: |
          npx next start -p 5000 > /tmp/p5-estimator-server.log 2>&1 &
          node -e 'const u="http://127.0.0.1:5000/estimate/p5-preview";let n=0;const t=setInterval(async()=>{try{const r=await fetch(u);if(r.ok){clearInterval(t)}}catch{}if(++n>90){clearInterval(t);process.exit(1)}},1000)'
          node scripts/diag-webkit-request.mjs
          P5_PARENT=0 node scripts/p5-mobile-navigation.mjs
          node --import tsx scripts/p5-estimator-browser.mjs
          P5_TEST_BROWSER=webkit node --import tsx scripts/p5-estimator-browser.mjs
          P5_TEST_BASE_URL=http://127.0.0.1:5000 node --import tsx scripts/p5-intake-intent-browser.mjs
          P5_TEST_BASE_URL=http://127.0.0.1:5000 P5_TEST_BROWSER=webkit node --import tsx scripts/p5-intake-intent-browser.mjs
          P5_TEST_BASE_URL=http://127.0.0.1:5000 node scripts/p5-exit-browser.mjs
          P5_TEST_BASE_URL=http://127.0.0.1:5000 P5_TEST_BROWSER=webkit node scripts/p5-exit-browser.mjs
          node scripts/p5-admin-pricing-browser.mjs
          node scripts/test-request-history-browser.mjs
      - name: Offline evidence guard regressions
        run: node --test tests/ci-evidence.test.mjs
      - name: Package complete evidence within storage limit
        id: evidence
        if: always()
        run: node scripts/prepare-ci-evidence.mjs estimator
      - uses: actions/upload-artifact@v4
        if: always() && steps.evidence.outputs.archive_ready == 'true'
        with:
          name: p5-estimator-verification
          path: ci-evidence-artifacts/estimator.tar.gz
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
